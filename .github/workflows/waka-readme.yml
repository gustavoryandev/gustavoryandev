name: Waka Card

on:
  schedule:
    - cron: "15 */6 * * *" # a cada 6 horas (15 min depois dos outros workflows)
  workflow_dispatch: # permite rodar manualmente na aba Actions

permissions:
  contents: write # necessário para commitar o SVG

jobs:
  waka-card:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # derruba o job se algo travar
    concurrency:
      group: waka-card
      cancel-in-progress: true # um novo run cancela o anterior
    steps:
      - uses: actions/checkout@v4

      - name: Gerar card do WakaTime
        env:
          WAKATIME_ACCESS_TOKEN: ${{ secrets.WAKATIME_ACCESS_TOKEN }}
          # WAKA_RANGE: last_7_days # descomente para cards semanais (padrão: last_30_days)
        run: python3 .github/scripts/waka_card.py

      - name: Commitar o card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add waka-card/
          git diff --cached --quiet || git commit -m "chore: atualiza card do WakaTime"
          git pull --rebase
          git push
